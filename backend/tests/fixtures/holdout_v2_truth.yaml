about: 'מסמך סינתטי לדמו. Held-out corpus v2: appraisal-like documents on topics that none of the earlier fixtures, question sets or fixes covered. Files live in tests/fixtures/holdout_v2/. The documents produce no records (no ''שווי הנכס:'' header label, no price or value column), so ground_truth.yaml, the record counts and the 77-item evaluation are unaffected. Same schema as ground_truth.yaml `general_facts`. Values are as the document states them; `normalized` gives the canonical unit when the document uses another one. Boolean facts record explicit statements only; `not_stated` lists, per attribute, the documents with no fact for it. Generated by scripts/generate_fixtures.py - do not edit by hand.'
