dedup:
  rule: certain = same office + block/parcel/sub-parcel + transaction date + price, agreeing on data kind, area, area type and property type; same key with any disagreement = uncertain (never merged)
  certain:
  - office: A
    occurrences:
    - document: D1
      record: D1-T01
      row_index: 1
    - document: D4
      record: D4-T00
      row_index: 0
    reason: same block/parcel/sub-parcel, transaction date, price, data kind, area, area type and property type
  uncertain:
  - office: A
    occurrences:
    - document: D1
      record: D1-T00
      row_index: 0
    - document: D4
      record: D4-T01
      row_index: 1
    reason: same block/parcel/sub-parcel, transaction date and price but different area, area_type
  cross_office_overlaps:
  - address: הגפן 20
    records:
    - D1-T00
    - DB1-T00
    note: same address in office A and office B with different date and price; never merged or visible across offices
  versions:
  - document: D1v2
    replaces: D1
    note: version replacement, not duplication; only one version is current
