# General question set (U12, KTD16): held-out topics and attributes that appear nowhere in backend/app.
#
# Written BEFORE any prompt tuning (plan U12 execution note). Do not edit an item's question or expected
# outcome after seeing results; add a new item instead.
#
# Truth: every expected value, page and coverage list below is derived from the `general_facts` section of
# tests/fixtures/ground_truth.yaml (documents H1..H8, H4v2 in tests/fixtures/general/, group G3 "ידע כללי",
# visible to admin-a and dana, never to yossi or office B). Items marked `truth: records` (AE3, AE5) instead
# take their numbers from eval/truth.py like eval/questions.yaml. `facts:` lists the general_facts ids an
# expected value is computed from; tests/unit/test_fixtures_ground_truth.py recomputes every `result` from
# them. D* ids are the original fixtures (ground_truth.yaml `documents`); their mentions of these topics are
# listed in general_facts.existing_mentions. H4 is superseded by H4v2 and never counts as a current document.
#
# Item fields: id, category, held_out (the item's topic/attribute word, listed in `terms`, occurs nowhere in
# backend/app; enforced by tests/unit/test_no_topic_vocabulary.py), user (default admin-a@demo.test),
# cloud (on | off, default on), turns (one or more; a multi-turn item is one conversation).
#
# How each expectation is scored (wording is never scored):
#   task_type        exact match of the turn's validated plan task type
#                    (locate | answer | compare | compute | compute_explain | clarify | abstain).
#   tool             when given, the plan's main tool (search | extract_and_compute | compute_records | compare |
#                    show_sources | explain_previous).
#   relation         when given, the turn relation (new_question | follow_up | answer_to_clarification |
#                    topic_change | meta_sources | ...); `cleared` / `kept` name state keys that must be cleared
#                    or kept after the turn.
#   outcome          answer       a content answer; every `sources.all_of` entry is cited (doc + physical page;
#                                 page null = DOCX, any page) and every other cited source is in all_of or
#                                 `sources.also_valid`. Each `values` entry is stated as a claim cited to its doc.
#                    computation  a computed figure: `result.value` equals the answer's figure as a Decimal in the
#                                 canonical unit (ROUND_HALF_UP to 0.01 for means), `result.n` equals the number
#                                 of observations, each value in `values` is cited at its page, and the coverage
#                                 reports `coverage.values_found` values; every doc in `not_stated_includes` is
#                                 reported as not stating the datum (or not yet extracted), never as a value.
#                                 Superseded versions (H4) never count. No price clarification may appear.
#                    comparison   both `sides` are cited and labeled (by version for version_diff items); with
#                                 `incomplete: true` the answer must say the comparison is incomplete and name the
#                                 side without evidence instead of comparing.
#                    abstain      no figure in the answer; `abstention_kind` matches (or one of
#                                 `abstention_kind_any_of`): not_found | not_stated | not_extracted_or_verified |
#                                 insufficient_permission_scope. `limited_mode: true` = labeled limited mode (cloud off).
#                    clarification  the system asks about `clarify_key` and shows no figure.
#   conflict         true: both conflicting statements are shown with their sources; neither is silently chosen.
#   forbid           other_group | other_office: no cited source may come from documents outside the user's scope.
#   no_price_clarification  true: no transaction-price / appraised-value clarification may be raised.

