        expect:
          task_type: answer
          outcome: answer
          no_price_clarification: true
          sources: {all_of: [{doc: K3v2, page: 1}], also_valid: [{doc: K3, page: 1}]}
          values: [{fact: K3v2-F02, value: 10, unit: year, value_words: [עשר]}]
