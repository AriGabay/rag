# Held-out general question set v2 (U12, KTD16): a NEW, SEPARATE evaluation on topics, documents and phrasings
# that none of the earlier fixtures, question sets (eval/questions.yaml, eval/questions_general.yaml) or fixes
# covered.
#
# PROVENANCE: written on 2026-10-06 against base commit 05df270, BEFORE any run of this set against the system
# and without reading the answering code in backend/app (only backend/app/extraction/* and
# backend/app/appraisal/extract.py were read, to make sure the documents create no records). Every expected
# behavior below was fixed in advance. Do NOT use this set for tuning prompts, vocabulary or code; do not edit
# an item's question or expected outcome after seeing results - add a new item instead. No code path routes by its
# topic words.
#
# Truth: every expected value, page and coverage list is derived from tests/fixtures/holdout_v2_truth.yaml
# (documents K1..K8 and K3v2 in tests/fixtures/holdout_v2/, office A, group G4 "ידע כללי ב", visible to
# admin-a and dana, never to yossi or office B). That file has the same schema as ground_truth.yaml
# `general_facts`; to score this set, eval/general.py reads it in place of `general_facts` (facts, documents,
# conflicts, versions) and maps the K* file names to their ids. K3 is superseded by K3v2 and never counts as a
# current document (the role H4 plays in the first set). D*/H* ids are the earlier fixtures; their sentences
# on these topics are listed in holdout_v2_truth.yaml `existing_mentions` (D3 states noise and maintenance
# without a figure; "צמוד"/"הצמדה בלעדית" in the H documents means attached, not CPI-linked).
# tests/unit/test_fixtures_ground_truth.py recomputes every `result` from the truth file.
#
# Item fields: id, category, held_out (the item's topic word, listed in `terms`, occurs nowhere in backend/app),
# terms, user (default admin-a@demo.test), cloud (on | off, default on), note, turns (one conversation).
# Categories: explicit_text_fact, table_datum, locate, explanation, comparison, version_diff, conflict,
# computation, unextracted_datum, missing_info, follow_up, topic_switch, clarification, negation.
#
# Expectations use exactly the keys of eval/questions_general.yaml and are scored the same way (see that file's
# header): task_type, tool, relation, cleared, kept, pending_kept, outcome (answer | computation | comparison |
# abstain | clarification), clarify_key, abstention_kind / abstention_kind_any_of, limited_mode, sources
# (all_of / also_valid; page null = DOCX), values, result (scope, attribute, metric, value, unit, n, where,
# facts), coverage (values_found, not_stated_includes, stated_absent, mentioned_without_value), sides,
# incomplete, missing_side, labeled_by_version, changed, conflict, forbid, no_price_clarification,
# allow_further_clarification.
#
# When the CORRECT behavior is a clarification, `outcome: clarification` with its `clarify_key` says so; an
# answer that picks one referent is a failure. When the CORRECT behavior is a justified abstention,
# `outcome: abstain` with the accepted kinds says so; a guessed figure is a failure. In every other item an
# abstention or a clarification is a failure.
#
# Additions specific to this set (informational for the scorer, never needed to pass):
#   value_words  a value the document writes only in words; the answer may give the digits or the word.
#   result.metric also uses `max`; result units outside the scorer's unit map (ILS/month, ILS/m2/month,
#                ILS/m2, score, dB) are not unit-checked.

items:
  # --- explicit text facts -------------------------------------------------------------------------------
