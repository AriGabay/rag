      - ask: "מה מחיר למ״ר ברמת גן בשכונת חרוזים בשנת 2024?"
        expect:
          outcome: numeric
          filters: {data_kind: transaction_price, date_field: transaction_date, year_from: 2024, city: רמת גן, neighborhood: חרוזים, area_type: net, property_type: apartment, vat_basis: included}
