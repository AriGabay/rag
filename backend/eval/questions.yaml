# Evaluation set (U15) for scripts/eval.py — run against the live demo stack seeded by scripts/seed_demo.py.
#
# Every item is one conversation. Each turn asks a question; the runner answers the clarifications
# the system raises from `clarify` (default: the values in `expect.filters`) and scores the final
# answer of the turn against `expect`. Expected numbers are never written here: the runner computes
# them from tests/fixtures/ground_truth.yaml for `expect.filters`, the asking user's document groups,
# and the live review queue (records still awaiting verification are excluded).
#
# expect.outcome:
#   numeric        exact match of record_count, mean, weighted, median, min, max (Decimal, ROUND_HALF_UP)
#   clarification  the system asks about `key` (and shows no number)
#   abstain        explicit abstention, no number
#   content        a content answer whose sources include one of `sources` (doc + physical page)
#   combined       numeric part as for `numeric` plus content sources
#   any            used with `forbid` for isolation items: whatever the kind, no forbidden source
# expect.forbid: other_office | other_group — no source may come from documents outside the user's scope.
# Office B items assert only isolation, never B's record counts (other demo flows may add B documents).

items:
  # --- numeric, by transaction date ---------------------------------------------------------------
  - id: N01
    category: numeric_transaction_date
    user: admin-a@demo.test
    note: core example from the spec; clarifies data kind, date field, area basis, property type, VAT
