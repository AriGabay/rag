[project]
name = "appraisal-rag"
version = "0.1.0"
description = "Internal Hebrew knowledge engine for real-estate appraisal offices (MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.1.3",
  "alembic>=1.20",
  "psycopg[binary]>=3.3.6",
  "pgvector>=0.5",
  "argon2-cffi>=25.1",
  "pdfplumber>=0.11.10",
  "pypdfium2>=5.14",
  "pypdf>=6.19",
  "python-bidi>=0.6.11",
  "python-docx>=1.2",
  "pytesseract>=0.3.13",
  "pillow>=11",
  "anthropic>=1.11",
  "httpx>=0.28",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Local multilingual embeddings (KTD10). CPU-only torch on Linux.
ml = [
  "sentence-transformers>=6.1",
  "torch>=2.14",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.14",
  "fpdf2>=2.8.9",
  "uharfbuzz>=0.50",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs the Postgres test database",
  "ocr: needs tesseract with Hebrew data",
  "slow: slow test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
