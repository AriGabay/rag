# Isolated real-model stack (round 25, U6, KTD10). A STANDALONE compose file: use it alone with -f, never layered on
# docker-compose.yml (Compose 2.7.0 has no !override, so layering would merge the office ports 5433, 8000 and 3000).
# Own project name, own host ports (15433 database, 18000 backend, 13000 frontend), own named volumes, own image
# names (building here never retags the office image `appraisal-rag-backend`), same Dockerfiles and build contexts.
# Drive it with scripts/isolated_stack.sh; its environment comes only from
# real_documents/tests/round25/ops/isolated.env (gitignored, passed with --env-file).
name: appraisal-rag-isolated

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://rag_app:${RAG_APP_PASSWORD:?set in isolated.env}@db:5432/rag
  OWNER_DATABASE_URL: postgresql+psycopg://rag_owner:${RAG_OWNER_PASSWORD:?set in isolated.env}@db:5432/rag
  FILE_STORAGE_ROOT: /data/files
  SESSION_SECRET: ${SESSION_SECRET:?set in isolated.env}
  DEMO_MODE: ${DEMO_MODE:-true}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  # Provider values pass through unchanged; empty means "use the settings default" (no model default here).
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  OPENAI_KEY: ${OPENAI_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  MODEL_AGENT: ${MODEL_AGENT:-}
  MODEL_RESOLVE: ${MODEL_RESOLVE:-}
  MODEL_VERIFY: ${MODEL_VERIFY:-}
  MODEL_MEASURE: ${MODEL_MEASURE:-}
  MODEL_VISION: ${MODEL_VISION:-}
  MODEL_SUMMARY: ${MODEL_SUMMARY:-}
  MODEL_IDENTIFY: ${MODEL_IDENTIFY:-}
  EFFORT_AGENT: ${EFFORT_AGENT:-}
  EFFORT_RESOLVE: ${EFFORT_RESOLVE:-}
  EFFORT_VERIFY: ${EFFORT_VERIFY:-}
  EFFORT_MEASURE: ${EFFORT_MEASURE:-}
  EFFORT_VISION: ${EFFORT_VISION:-}
  EFFORT_SUMMARY: ${EFFORT_SUMMARY:-}
  EFFORT_IDENTIFY: ${EFFORT_IDENTIFY:-}
  CHAT_AGENT_OUTPUT_TOKENS: ${CHAT_AGENT_OUTPUT_TOKENS:-12000}
  # The forced-failure step of the walkthrough sets this to an impossibly short value in isolated.env, then restores it.
  LLM_TIMEOUT_AGENT_SECONDS: ${LLM_TIMEOUT_AGENT_SECONDS:-90}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
  HF_HUB_OFFLINE: "1"

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in isolated.env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      RAG_OWNER_PASSWORD: ${RAG_OWNER_PASSWORD}
      RAG_APP_PASSWORD: ${RAG_APP_PASSWORD}
    volumes:
      - iso_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./backend
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
    image: appraisal-rag-isolated-backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: appraisal-rag-isolated-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    volumes:
      - iso_filedata:/data/files
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: appraisal-rag-isolated-backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - iso_filedata:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: appraisal-rag-isolated-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - backend

volumes:
  iso_pgdata:
  iso_filedata:
